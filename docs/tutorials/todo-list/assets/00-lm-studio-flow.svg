<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">Préparation LM Studio</title>
  <desc id="desc">Téléchargement du modèle, démarrage du serveur et consommation par Arclith.</desc>
  <rect width="1120" height="300" rx="10" fill="#111827"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="40" y="50" fill="#f9fafb" font-size="26" font-weight="700">LM Studio pour les tests locaux</text>
    <rect x="55" y="100" width="210" height="90" rx="8" fill="#1f2937" stroke="#60a5fa"/>
    <text x="85" y="135" fill="#dbeafe" font-size="17" font-weight="700">1. Modèle</text>
    <text x="85" y="162" fill="#bfdbfe" font-size="13">Télécharger un modèle</text>
    <text x="85" y="183" fill="#bfdbfe" font-size="13">noter son model id</text>
    <rect x="345" y="100" width="235" height="90" rx="8" fill="#1f2937" stroke="#2dd4bf"/>
    <text x="375" y="135" fill="#ccfbf1" font-size="17" font-weight="700">2. Serveur local</text>
    <text x="375" y="162" fill="#99f6e4" font-size="13">Port 1234</text>
    <text x="375" y="183" fill="#99f6e4" font-size="13">API OpenAI-compatible</text>
    <rect x="660" y="100" width="220" height="90" rx="8" fill="#1f2937" stroke="#f59e0b"/>
    <text x="690" y="135" fill="#fef3c7" font-size="17" font-weight="700">3. Vérification</text>
    <text x="690" y="162" fill="#fde68a" font-size="13">GET /v1/models</text>
    <text x="690" y="183" fill="#fde68a" font-size="13">POST chat completions</text>
    <rect x="945" y="100" width="135" height="90" rx="8" fill="#1f2937" stroke="#a78bfa"/>
    <text x="975" y="135" fill="#ede9fe" font-size="17" font-weight="700">Arclith</text>
    <text x="975" y="162" fill="#ddd6fe" font-size="13">lm.yaml</text>
    <text x="975" y="183" fill="#ddd6fe" font-size="13">agent</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M265 145 L345 145"/>
    <path d="M580 145 L660 145"/>
    <path d="M880 145 L945 145"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
