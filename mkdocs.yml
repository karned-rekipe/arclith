site_name: Arclith
site_description: Documentation Arclith pour construire des services hexagonaux Python.
site_url: https://karned-rekipe.github.io/arclith/
repo_url: https://github.com/karned-rekipe/arclith
repo_name: karned-rekipe/arclith

docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
  palette:
    scheme: slate
    primary: black
    accent: teal

extra_css:
  - stylesheets/code-blocks.css

nav:
  - Accueil: index.md
  - Quickstarts:
      - Vue d'ensemble: quickstarts/index.md
      - API: quickstarts/api.md
      - MCP: quickstarts/mcp.md
      - Bus: quickstarts/bus.md
      - Agent: quickstarts/agent.md
  - Foundations:
      - C'est quoi Arclith ?: foundations/what-is-arclith.md
      - Le chemin hexagonal: foundations/hexagonal-flow.md
      - Modes runtime: foundations/runtime-modes.md
  - Formation:
      - Parcours: learning/training-path.md
      - Format d'une page: learning/page-format.md
  - Tutoriel Todo:
      - Vue d'ensemble: tutorials/todo-list/index.md
      - Préparer LM Studio: tutorials/todo-list/00-lm-studio.md
      - 1. Initialiser le projet: tutorials/todo-list/01-init-project.md
      - 2. Créer l'entité: tutorials/todo-list/02-create-entity.md
      - 3. Créer les use cases: tutorials/todo-list/03-create-usecase.md
      - 4. Exposer une API:
          - Vue d'ensemble: tutorials/todo-list/04-api.md
          - 4.1 Config et schémas: tutorials/todo-list/04-api-config-schemas.md
          - 4.2 Handlers HTTP: tutorials/todo-list/04-api-handlers.md
          - 4.3 Router et main: tutorials/todo-list/04-api-router-main.md
          - 4.4 Tester l'API: tutorials/todo-list/04-api-tests.md
      - 5. Exposer un MCP:
          - Vue d'ensemble: tutorials/todo-list/05-mcp.md
          - 5.1 Tools MCP: tutorials/todo-list/05-mcp-tools.md
          - 5.2 Entrypoint et tests: tutorials/todo-list/05-mcp-entrypoint-tests.md
          - 5.3 LM Studio: tutorials/todo-list/05-mcp-lm-studio.md
      - 6. Ajouter un agent:
          - Vue d'ensemble: tutorials/todo-list/06-agent.md
          - 6.1 Config LLM et LangSmith: tutorials/todo-list/06-agent-config.md
          - 6.2 Intent-interpreters: tutorials/todo-list/06-agent-intent-interpreters.md
          - 6.3 État et parsing: tutorials/todo-list/06-agent-state-parsing.md
          - 6.4 Action et collecte: tutorials/todo-list/06-agent-action-collection.md
          - 6.5 Routing et dépendances: tutorials/todo-list/06-agent-routing-dependencies.md
          - 6.6 Noeuds et graphe: tutorials/todo-list/06-agent-nodes-graph.md
          - 6.7 Tests et Studio: tutorials/todo-list/06-agent-tests-studio.md
      - Annexes locales: tutorials/todo-list/07-local-services.md
  - Production:
      - Baseline: production/baseline.md
      - Docker:
          - Vue d'ensemble: runtime-docker.md
          - 1. Build: runtime-docker/build.md
          - 2. Lancement local API: runtime-docker/local-api.md
          - 3. Lancement local MCP: runtime-docker/local-mcp.md
          - 4. Lancement local agent: runtime-docker/local-agent.md
          - 5. Autres modes locaux: runtime-docker/local-other-modes.md
          - 6. Docker Compose: runtime-docker/docker-compose.md
          - 7. Kubernetes: runtime-docker/kubernetes.md
  - Capabilities:
      - Catalogue: capabilities.md
      - API: capabilities/api.md
      - MCP: capabilities/mcp.md
      - Agent: capabilities/agent.md
      - Command Bus: capabilities/command-bus.md
      - Probe: capabilities/probe.md
      - Runtime: capabilities/runtime.md
      - Repository: capabilities/repository.md
      - Cache: capabilities/cache.md
      - Logger: capabilities/logger.md
      - Secrets: capabilities/secrets.md
      - Auth: capabilities/auth.md
      - Tenant: capabilities/tenant.md
      - License: capabilities/license.md
      - HTTP: capabilities/http.md
      - LLM: capabilities/llm.md
      - Observability: capabilities/observability.md
  - Deep Dives:
      - API: deep-dives/api.md
      - MCP: deep-dives/mcp.md
      - Bus: deep-dives/bus.md
      - Agent: deep-dives/agent.md
      - Configuration: deep-dives/configuration.md
  - Référence:
      - Ancien quickstart complet: quickstart.md
      - Ancien quickstart agent: agent-quickstart.md
      - Auth: auth.md
      - HTTP: http-conventions.md
      - Command Bus: command-bus.md
      - Idempotence: idempotency.md
      - Multitenant: multitenant.md
      - Cache: caching.md
      - Décisions: decisions.md
      - Release: release.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      auto_title: true
      line_spans: __span
      linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
