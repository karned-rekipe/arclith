name: CLI E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-e2e.yml'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  e2e-scaffold:
    name: E2E — Scaffold & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          save-cache: false

      - name: Install CLI dependencies
        working-directory: cli
        run: uv sync --group dev

      - name: Install arclith-cli tool
        working-directory: cli
        run: uv tool install .

      - name: Run E2E tests
        working-directory: cli
        run: uv run pytest tests/ -v --tb=short

      - name: Quick smoke test — scaffold real project
        run: |
          cd /tmp
          arclith-cli | grep "Commands"
          arclith-cli new TestEntity test-smoke --port 9999
          cd test-smoke

          # Generated consumers target stable PyPI and contain no local source override.
          if grep -q '\[tool\.uv\.sources\]' pyproject.toml; then
            echo "❌ Generated project contains [tool.uv.sources] — template is broken"
            exit 1
          fi
          grep '"arclith>=' pyproject.toml

          # `new` is only `init + add-entity`: no technology is inferred.
          test ! -d src/test_smoke/adapters/inbound/fastapi
          test ! -d src/test_smoke/adapters/inbound/fastmcp
          test ! -d src/test_smoke/adapters/bidirectional/rabbitmq
          test ! -d src/test_smoke/adapters/outbound/mongodb
          test ! -e Dockerfile

          arclith-cli add-usecase CreateTestEntity --entity TestEntity
          arclith-cli add-adapter --capability repository --adapter memory --yes
          arclith-cli add-adapter --capability api --adapter fastapi \
            --param port=9999 --param reload=false --yes
          arclith-cli expose-usecase create-test-entity --via fastapi \
            --feature test_entities --path /v1/test-entities --method POST \
            --status-code 201

          # The selected adapter is installed alone.
          test -d src/test_smoke/adapters/inbound/fastapi
          test ! -d src/test_smoke/adapters/inbound/fastmcp
          test ! -d src/test_smoke/adapters/bidirectional/rabbitmq
          test ! -d src/test_smoke/adapters/outbound/mongodb
          grep '"arclith\[fastapi\]>=' pyproject.toml

          # Validate the current repository version without waiting for PyPI propagation.
          python - <<'PY'
          import os
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          pyproject.write_text(
              pyproject.read_text().rstrip()
              + f'\n\n[tool.uv.sources]\narclith = {{ path = "{os.environ["GITHUB_WORKSPACE"]}", editable = true }}\n'
          )
          PY

          # Install and validate the generated project and its public HTTP contract.
          uv sync --group dev
          uv run pytest -q
          uv run python - <<'PY'
          import importlib.util

          from fastapi.testclient import TestClient

          from main import build_api

          application = build_api()
          post_routes = [
              route
              for route in application.routes
              if "POST" in getattr(route, "methods", set())
          ]
          assert [route.path for route in post_routes] == ["/v1/test-entities"]
          assert "/v1/v1/test-entities" not in application.openapi()["paths"]
          response = TestClient(application).post("/v1/test-entities", json={})
          assert response.status_code == 201
          assert set(response.json()) == {
              "uuid",
              "created_at",
              "created_by",
              "updated_at",
              "updated_by",
              "deleted_at",
              "deleted_by",
              "version",
              "is_deleted",
          }
          assert importlib.util.find_spec("fastmcp") is None
          assert importlib.util.find_spec("aio_pika") is None
          assert importlib.util.find_spec("motor") is None
          PY

          echo "✅ Smoke test passed"
