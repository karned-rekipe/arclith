name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: make precommit
      - run: make coverage

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build arclith
        run: uv build --out-dir dist/arclith .
      - name: Build arclith-cli
        run: uv build --out-dir dist/arclith-cli cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arclith-dist
          path: dist/arclith/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arclith-cli-dist
          path: dist/arclith-cli/

  publish-arclith:
    name: Publish arclith to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write  # Required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arclith-dist
          path: dist/arclith/
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Publish arclith
        run: uv publish --check-url https://pypi.org/simple/ dist/arclith/*

  publish-arclith-cli:
    name: Publish arclith-cli to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi-cli
    permissions:
      actions: read
      contents: read
      id-token: write  # Required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arclith-cli-dist
          path: dist/arclith-cli/
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Publish arclith-cli
        run: uv publish --check-url https://pypi.org/simple/ dist/arclith-cli/*
