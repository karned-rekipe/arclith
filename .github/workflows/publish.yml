name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: make precommit
      - run: make coverage

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build arclith
        run: uv build --out-dir dist/arclith .
      - name: Build arclith-cli
        run: uv build --out-dir dist/arclith-cli cli
      - uses: actions/upload-artifact@v4
        with:
          name: arclith-dist
          path: dist/arclith/
      - uses: actions/upload-artifact@v4
        with:
          name: arclith-cli-dist
          path: dist/arclith-cli/

  publish-arclith:
    name: Publish arclith to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write  # Required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arclith-dist
          path: dist/arclith/
      - uses: astral-sh/setup-uv@v5
      - name: Publish arclith
        run: uv publish --check-url https://pypi.org/simple/ dist/arclith/*

  publish-arclith-cli:
    name: Publish arclith-cli to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi-cli
    permissions:
      actions: read
      contents: read
      id-token: write  # Required for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arclith-cli-dist
          path: dist/arclith-cli/
      - uses: astral-sh/setup-uv@v5
      - name: Publish arclith-cli
        run: uv publish --check-url https://pypi.org/simple/ dist/arclith-cli/*
