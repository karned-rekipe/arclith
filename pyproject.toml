[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arclith"
version = "0.16.0"
description = "Hexagonal architecture framework — domain, use cases, repositories, adapters"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [
    { name = "Killian KOPP", email = "killiankopp@gmail.com" }
]
keywords = ["hexagonal-architecture", "async", "framework", "domain", "repository", "clean-architecture", "ddd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "uuid6==2025.0.1",
    "loguru==0.7.3",
    "fastapi>=0.135.1",
    "fastmcp>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/karned-rekipe/arclith"
Repository = "https://github.com/karned-rekipe/arclith"

[project.optional-dependencies]
mongodb = ["motor==3.7.1"]
duckdb  = ["duckdb==1.5.0", "pytz==2024.1"]
mariadb = ["sqlalchemy[asyncio]>=2.0.36", "asyncmy>=0.2.10"]
fastapi = ["fastapi==0.135.1", "uvicorn==0.41.0"]
mcp     = ["fastmcp==3.1.0"]
vault   = ["hvac==2.3.0"]
cache   = ["redis>=5.0.0"]
auth    = ["PyJWT[crypto]>=2.8.0", "httpx>=0.27.0"]
rabbitmq = ["aio-pika>=10.0.1,<11.0.0"]
langgraph = ["langgraph>=1.0.8", "langgraph-api>=0.11.0", "langgraph-cli[inmem]>=0.4.31", "langsmith>=0.4.0", "pydantic-ai-slim[anthropic,openai]>=2.24.0,<3.0.0"]
opentelemetry = ["opentelemetry-api>=1.30.0", "opentelemetry-sdk>=1.30.0", "opentelemetry-exporter-otlp>=1.30.0", "opentelemetry-instrumentation-fastapi>=0.51b0", "opentelemetry-instrumentation-logging>=0.51b0"]
all     = [
    "motor==3.7.1",
    "duckdb==1.5.0",
    "pytz==2024.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.10",
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "fastmcp==3.1.0",
    "hvac==2.3.0",
    "redis>=5.0.0",
    "PyJWT[crypto]>=2.8.0",
    "httpx>=0.27.0",
    "aio-pika>=10.0.1,<11.0.0",
    "langgraph>=1.0.8",
    "langgraph-api>=0.11.0",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.4.0",
    "pydantic-ai-slim[anthropic,openai]>=2.24.0,<3.0.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-logging>=0.51b0",
    "azure-storage-blob>=12.27.1,<13.0.0",
    "azure-identity>=1.25.1,<2.0.0",
    "boto3>=1.43.70",
    "google-cloud-storage>=3.3.0,<4.0.0",
]
azure-blob = [
    "azure-storage-blob>=12.27.1,<13.0.0",
    "azure-identity>=1.25.1,<2.0.0",
]
s3 = [
    "boto3>=1.43.70",
]
gcs = [
    "google-cloud-storage>=3.3.0,<4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["arclith"]
branch = true
omit = [
    # Adapters requiring real external services
    "arclith/adapters/outbound/mongodb/*",
    "arclith/adapters/outbound/duckdb/*",
    "arclith/adapters/outbound/mariadb/*",
    # Bootstrap — wired via integration tests, not unit tests
    "arclith/arclith.py",
    "**/__init__.py",
    # Auth pipeline — unit tests pending (SK-AUTH-01)
    "arclith/adapters/inbound/auth_pipeline.py",
    "arclith/adapters/inbound/fastapi/auth.py",
    "arclith/adapters/inbound/fastmcp/auth.py",
    "arclith/adapters/inbound/fastmcp/dependencies.py",
    # Requires Keycloak JWKS endpoint (integration test)
    "arclith/adapters/inbound/jwt/*",
    "arclith/adapters/inbound/license/*",
    # Requires Redis (integration test)
    "arclith/adapters/outbound/redis/*",
    # Requires Vault (integration test)
    "arclith/adapters/outbound/vault/*",
    # Memory cache — tested implicitly through auth pipeline
    "arclith/adapters/outbound/memory/cache_adapter.py",
    # Abstract ports (ABCs — no implementation to test)
    "arclith/domain/ports/outbound/cache.py",
    "arclith/domain/ports/outbound/license_validator.py",
    "arclith/domain/ports/outbound/tenant_resolver.py",
]

[tool.coverage.report]
fail_under = 90

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["arclith"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.6",
    "mypy==1.19.1",
    "types-PyYAML==6.0.12.20250516",
    "bandit[toml]==1.9.4",
    "radon==6.0.1",
    "langgraph-api>=0.11.0",
    "pydantic-ai-slim[anthropic,openai]>=2.24.0,<3.0.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
