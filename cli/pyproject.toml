[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arclith-cli"
version = "0.18.0"
description = "CLI scaffolding tool for arclith — hexagonal architecture framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [
    { name = "Killian KOPP", email = "killiankopp@gmail.com" }
]
keywords = ["arclith", "scaffold", "hexagonal-architecture", "cli", "ddd"]
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "arclith>=0.21.0",
]

[tool.uv.sources]
arclith = { path = "..", editable = true }

[project.scripts]
arclith-cli = "arclith_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["arclith_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.6",
]
